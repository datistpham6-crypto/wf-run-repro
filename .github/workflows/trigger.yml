# Mirrors gemini-cli trigger_e2e.yml -- UNPRIVILEGED, runs on fork PRs.
name: 'Trigger Chained'
on:
  pull_request:
jobs:
  save_repo_name:
    runs-on: ubuntu-latest
    steps:
      - name: 'Save Repo name'
        env:
          # ATTACKER-CONTROLLED: `on: pull_request` executes the workflow file from
          # the PR head, so the PR itself decides what goes into the artifact.
          REPO_NAME: 'den3110/wf-run-artifact-payload'
          HEAD_SHA: '3b403c5f1afe609dff2978d8a87eee0996399122'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}"  > ./pr/head_sha
          echo "--- artifact contents ---"; cat ./pr/repo_name ./pr/head_sha
      - uses: actions/upload-artifact@v4
        with:
          name: 'repo_name'
          path: 'pr/'
